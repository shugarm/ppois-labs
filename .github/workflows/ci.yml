name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build, test, coverage, static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr cppcheck

      - name: Configure (with coverage, warnings are errors)
        run: >
          cmake -S lab1 -B build -DCMAKE_BUILD_TYPE=Debug
          -DLAB1_ENABLE_COVERAGE=ON -DLAB1_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Check code coverage (at least 90 % of lines)
        run: >
          gcovr --root . --object-directory build --filter 'lab1/src/'
          --print-summary --fail-under-line 90 --xml coverage.xml

      - name: Static analysis (cppcheck)
        run: >
          cppcheck --enable=warning,performance,portability --std=c++17
          --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem
          -I lab1/include lab1/src lab1/apps

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docs:
    name: Generate Doxygen documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Generate documentation
        working-directory: lab1
        run: doxygen Doxyfile
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: lab1-docs
          path: lab1/docs/html

  package:
    name: Package (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S lab1 -B build -DCMAKE_BUILD_TYPE=Release -DLAB1_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Install into dist
        run: cmake --install build --config Release --prefix dist
      - name: Create archive
        run: cmake -E tar cf lab1-${{ matrix.os }}.zip --format=zip -- dist
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: lab1-${{ matrix.os }}
          path: lab1-${{ matrix.os }}.zip

  release:
    name: Publish GitHub Release
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
